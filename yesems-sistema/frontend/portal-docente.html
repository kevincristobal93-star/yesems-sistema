<!doctype html>
<html lang="es-MX">
  <head>
    <link rel="stylesheet" href="./tokens.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Accede al portal docente de YES EMS para consultar tus cursos, pagos y constancias.">
    <meta name="robots" content="noindex, nofollow">
    <title>Portal docente | YES EMS</title>
    <link rel="icon" type="image/png" href="./assets/yesems-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./portal-docente.css">
  </head>
  <body class="teacher-portal">
    <main class="portal-shell">
      <section class="portal-card" aria-labelledby="portal-title">
        <a class="portal-brand" href="https://servicioseducativosyesems.com" aria-label="Volver al sitio de YES EMS">
          <img src="./assets/yesems-logo.png" alt="YES EMS" width="1254" height="1254">
        </a>
        <p class="eyebrow">Plataforma YES EMS</p>
        <h1 id="portal-title">Portal docente</h1>
        <p class="portal-description">Inicia sesión para revisar tus cursos, solicitudes, pagos y constancias desde un solo lugar.</p>
        <button class="primary-button" id="open-access" type="button">Iniciar sesión</button>
        <p class="portal-help">¿Aún no tienes cuenta? <a href="./cursos.html">Consulta los cursos disponibles</a>.</p>
        <a class="public-site-link" href="https://servicioseducativosyesems.com">Volver al sitio público</a>
      </section>
      <p class="portal-footer">YES EMS · Centro de Capacitación y Servicios Educativos</p>
    </main>
    <script src="./acceso.js"></script>
    <script src="./portal-docente.js"></script>
  </body>
</html>
