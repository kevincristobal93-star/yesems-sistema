<!doctype html>
<html lang="es-MX"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>YES EMS | Configuración</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./configuracion.css"></head>
<body><header class="site-header"><a class="brand" href="./cursos.html"><img src="./assets/yesems-logo.png" alt="YES EMS"></a><nav><a href="./panel.html">Mi panel</a><a href="./cursos.html">Cursos</a><button id="logout-button" type="button">Cerrar sesión</button></nav></header><main><p class="eyebrow">Mi cuenta</p><h1>Configuración</h1><p class="intro">Actualiza tus datos de contacto. Tus datos de inscripción se conservan protegidos.</p><section class="settings-card"><div class="profile-heading"><span id="profile-initial">A</span><div><h2 id="profile-name">Cargando...</h2><p id="profile-email"></p></div></div><form id="settings-form"><div class="two-columns"><div><label for="nombre">Nombre</label><input id="nombre" required></div><div><label for="apellido">Apellido</label><input id="apellido" required></div></div><label for="telefono">Teléfono</label><input id="telefono" type="tel" autocomplete="tel"><div class="read-only"><span>Correo electrónico</span><strong id="email-readonly"></strong></div><div class="read-only"><span>Folio de alumno</span><strong id="folio-readonly">Se genera al confirmar una inscripción</strong></div><p id="settings-message" role="alert"></p><button type="submit">Guardar cambios</button></form></section></main><script src="./configuracion.js"></script></body></html>
