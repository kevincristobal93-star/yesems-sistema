<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Boceto del editor de módulos del administrador</title>
  <desc id="desc">Propuesta visual para administrar módulos, enlaces de YouTube, presentaciones y evaluaciones de un curso.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#122b43" flood-opacity=".09"/></filter>
    <style>text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#172d45}.muted{fill:#718198}.small{font-size:13px}.label{font-size:12px;font-weight:700;letter-spacing:1.2px}.bold{font-weight:700}.white{fill:#fff}.blue{fill:#176d82}.yellow{fill:#ffc72c}</style>
  </defs>
  <rect width="1440" height="900" fill="#f2f6f9"/>
  <rect width="264" height="900" fill="#082b43"/>
  <circle cx="48" cy="48" r="24" fill="#ffc72c"/><text x="48" y="53" text-anchor="middle" class="bold" font-size="12">YES</text><text x="84" y="44" class="white bold" font-size="17">Administración</text><text x="84" y="64" fill="#a8c1d0" font-size="12">Gestión académica</text>
  <text x="30" y="127" fill="#a8c1d0" class="label">CONTENIDOS</text>
  <rect x="16" y="147" width="232" height="48" rx="12" fill="#174e67"/><rect x="16" y="147" width="4" height="48" rx="2" fill="#ffc72c"/><text x="43" y="177" class="white bold" font-size="14">▤　Cursos y módulos</text>
  <text x="43" y="230" fill="#d0dce4" font-size="14">▣　Disponibilidad</text><text x="43" y="276" fill="#d0dce4" font-size="14">◷　Sesiones y avance</text><text x="30" y="340" fill="#a8c1d0" class="label">ACREDITACIÓN</text><text x="43" y="380" fill="#d0dce4" font-size="14">▱　Exámenes</text><text x="43" y="426" fill="#d0dce4" font-size="14">▧　Constancias</text>
  <rect x="264" width="1176" height="78" fill="#fff"/><path d="M264 77.5H1440" stroke="#dce5ec"/><text x="302" y="48" class="bold" font-size="18">YES EMS　/　Cursos y módulos</text><circle cx="1370" cy="39" r="18" fill="#edf5f7"/><text x="1370" y="44" text-anchor="middle" class="blue bold" font-size="12">A</text>
  <text x="306" y="128" class="label blue">DISEÑO DEL CURSO</text><text x="306" y="167" class="bold" font-size="29">Organiza el aprendizaje por módulos</text><text x="306" y="196" class="muted" font-size="15">Agrega videos, presentaciones y evaluaciones. El docente avanzará siguiendo este orden.</text>
  <rect x="1120" y="112" width="132" height="46" rx="12" fill="#fff" stroke="#d4dfe7"/><text x="1186" y="141" text-anchor="middle" class="bold" font-size="13">Vista previa</text><rect x="1265" y="112" width="145" height="46" rx="12" fill="#173f6e"/><text x="1337" y="141" text-anchor="middle" class="white bold" font-size="13">Publicar curso</text>
  <rect x="304" y="222" width="790" height="630" rx="18" fill="#fff" filter="url(#shadow)"/>
  <text x="334" y="263" class="label muted">CURSO</text><text x="334" y="295" class="bold" font-size="20">Excel para docentes</text><text x="334" y="320" class="muted small">6 módulos　·　4 publicados　·　2 en borrador</text>
  <rect x="326" y="343" width="746" height="174" rx="14" fill="#f9fbfc" stroke="#dbe5ec"/><circle cx="354" cy="375" r="15" fill="#173f6e"/><text x="354" y="380" text-anchor="middle" class="white bold" font-size="12">1</text><text x="380" y="380" class="bold" font-size="15">Primeros pasos</text><text x="1002" y="380" class="muted small">↑　↓　⋯</text>
  <text x="350" y="416" class="label blue">VIDEO DE YOUTUBE</text><rect x="350" y="429" width="684" height="38" rx="8" fill="#fff" stroke="#cedbe4"/><text x="367" y="453" class="muted small">https://www.youtube.com/watch?v=…</text>
  <text x="350" y="492" class="label blue">PRESENTACIÓN</text><rect x="493" y="474" width="316" height="30" rx="8" fill="#fff" stroke="#cedbe4"/><text x="510" y="494" class="muted small">📄 Presentación_intro.pdf</text><text x="835" y="494" class="blue small">Reemplazar　Quitar</text>
  <rect x="326" y="532" width="746" height="148" rx="14" fill="#f9fbfc" stroke="#dbe5ec"/><circle cx="354" cy="564" r="15" fill="#edf1f5"/><text x="354" y="569" text-anchor="middle" class="muted bold" font-size="12">2</text><text x="380" y="569" class="bold" font-size="15">Fórmulas básicas</text><text x="1002" y="569" class="muted small">↑　↓　⋯</text><text x="350" y="607" class="label blue">VIDEO DE YOUTUBE</text><rect x="350" y="618" width="684" height="38" rx="8" fill="#fff" stroke="#cedbe4"/><text x="367" y="642" class="muted small">Pega aquí el enlace de YouTube</text>
  <rect x="326" y="697" width="746" height="56" rx="12" fill="#fff" stroke="#b9cedb" stroke-dasharray="5 4"/><text x="699" y="731" text-anchor="middle" class="blue bold" font-size="14">＋　Agregar módulo</text>
  <rect x="1120" y="222" width="290" height="300" rx="18" fill="#fff" filter="url(#shadow)"/><text x="1148" y="263" class="bold" font-size="17">Evaluaciones</text><text x="1148" y="291" class="muted small">Elige cómo evaluar el avance</text>
  <rect x="1148" y="316" width="18" height="18" rx="4" fill="#173f6e"/><path d="m1152 325 4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="1177" y="330" class="bold small">Examen breve por módulo</text><text x="1177" y="351" class="muted small">Repaso opcional al terminar cada tema</text>
  <rect x="1148" y="378" width="18" height="18" rx="4" fill="#173f6e"/><path d="m1152 387 4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="1177" y="392" class="bold small">Examen final obligatorio</text><text x="1177" y="413" class="muted small">Se habilita al completar los módulos</text>
  <text x="1148" y="456" class="label muted">PUNTAJE MÍNIMO</text><rect x="1148" y="468" width="234" height="38" rx="9" fill="#fff" stroke="#cedbe4"/><text x="1164" y="493" class="bold small">80%</text>
  <rect x="1120" y="544" width="290" height="183" rx="18" fill="#fff" filter="url(#shadow)"/><text x="1148" y="584" class="bold" font-size="17">Al aprobar</text><circle cx="1157" cy="617" r="9" fill="#dff4ec"/><text x="1157" y="621" text-anchor="middle" fill="#16845c" font-size="12">✓</text><text x="1177" y="622" class="small">Se registra el resultado</text><circle cx="1157" cy="651" r="9" fill="#dff4ec"/><text x="1157" y="655" text-anchor="middle" fill="#16845c" font-size="12">✓</text><text x="1177" y="656" class="small">Se habilita la constancia</text><text x="1148" y="697" class="muted small">El sistema conserva la fecha y el avance.</text>
</svg>
